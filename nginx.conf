
#user  nobody;
#全局块 - 设置Nginx运行的进程数
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;

#events块 - 连接处理机制
events {
    worker_connections  1024;
}

#http块 - 核心配置
http {
    #引入标准MIME类型。文件类型映射（conf/mime.types）中定义的所有类型，该配置让css/js等能被正确识别
    include       mime.types;
    #如果找不到扩展名对应的类型，则默认为二进制流
    default_type  application/octet-stream;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    #高效传输文件（零拷贝）
    sendfile        on;
    #tcp_nopush     on;

    #长连接超时时间
    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;

    server {
        # 监听端口和域名
        listen       80;
        server_name  web.uc.com;
        
        # 前端打包文件的根目录
        root   dist;
        # 默认首页文件
        index  index.html index.htm;

        # 前端静态文件配置
        location / {
            # 请求http://www.services.com/user的时候，流程：
            # 1、查找/user文件
            # 2、查找/user/目录
            # 3、返回兜底的/index.html（一般为Home组件）
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://localhost:8080/;

            # 保存代理信息
            # 请求头转发。把原始域名带给后端（有些业务需要）。
            proxy_set_header Host $host;
            # 告诉后端：真实客户端IP是谁
            proxy_set_header X-Real-IP $remote_addr;
            # 记录经过了"哪些代理"
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # 告诉后端是http还是https
            proxy_set_header X-Forwarded-Proto $scheme;

            # 跨域不是服务器限制，是浏览器限制
            # cors（以下配置，让Nginx告诉浏览器：允许什么样的访问，如何访问）
            
            # 预检请求：浏览器在跨域情况下，对"复杂请求"的安全确认（OPTIONS）
            #   什么是"复杂请求"？
            #   1、使用了特殊请求方法：PUT、DELETE、PATCH
            #   2、or 使用了非简单请求头
            #   3、Content-Type不属于简单类型（JSON数据之类）
            #   4、带了自定义Header
            if ($request_method = 'OPTIONS') {
                # CORS头（核心）：允许哪个域访问（谁来请求我，就允许谁访问）
                add_header 'Access-Control-Allow-Origin' '$http_origin' always;
                # 允许带登录信息（Cookie/Token）来访问我
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                # 允许哪些请求方式
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
                # 允许哪些请求头
                add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;

                return 204;
            }

            # 正常请求转发
            add_header 'Access-Control-Allow-Origin' $http_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
        }

        # 错误页面配置
        # 后端服务器返回以下类服务器端错误时，Nginx不会直接显示默认的报错信息，而是返回一个自定义的/50x.html
        error_page   500 502 503 504  /50x.html;
        # 处理错误页面的/50x.html配置在html目录下
        location = /50x.html {
            root   html;
        }
    }

    # another virtual host using mix of IP-, name-, and port-based configuration
    #
    #server {
    #    listen       8000;
    #    listen       somename:8080;
    #    server_name  somename  alias  another.alias;

    #    location / {
    #        root   html;
    #        index  index.html index.htm;
    #    }
    #}


