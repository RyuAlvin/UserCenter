
#user  nobody;
#全局块 - 设置Nginx运行的进程数
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;

#events块 - 连接处理机制
events {
    worker_connections  1024;
}

#http块 - 核心配置
http {
    #引入标准MIME类型。文件类型映射（conf/mime.types）中定义的所有类型，该配置让css/js等能被正确识别
    include       mime.types;
    #如果找不到扩展名对应的类型，则默认为二进制流
    default_type  application/octet-stream;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    #高效传输文件（零拷贝）
    sendfile        on;
    #tcp_nopush     on;

    #长连接超时时间
    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;

    #服务配置 - 一个server代表一个站点
    server {
        #监听端口和域名
        listen       80;
        #服务器域名（多个用空格分隔）
        server_name  localhost;

        #charset koi8-r;

        #access_log  logs/host.access.log  main;

        #前端静态文件配置
        location / {
            #前端打包文件的根目录
            root   dist;
            #请求http://www.services.com/user的时候，流程：
            #1、查找/user文件
            #2、查找/user/目录
            #3、返回兜底的/index.html（一般为Home组件）
            #以上，浏览器地址不变，但实际加载的是/index.html的内容（或$uri、$uri/）
            try_files $uri $uri/ /index.html;
            #默认首页文件
            index  index.html index.htm;
        }

        #Api反向代理配置
        #该配置适合后端无法修改的情况
        location /api/ {
            # 先处理 OPTIONS 预检请求
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }
            
            # 正常请求转发
            proxy_pass http://localhost:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 非预检请求也要加 CORS 头
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
        }

        #error_page  404              /404.html;

        # redirect server error pages to the static page /50x.html
        #
        #错误页面配置
        #后端服务器返回以下类服务器端错误时，Nginx不会直接显示默认的报错信息，而是返回一个自定义的/50x.html
        error_page   500 502 503 504  /50x.html;
        #处理错误页面的/50x.html配置在html目录下
        location = /50x.html {
            root   html;
        }

        # proxy the PHP scripts to Apache listening on 127.0.0.1:80
        #
        #location ~ \.php$ {
        #    proxy_pass   http://127.0.0.1;
        #}

        # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
        #
        #location ~ \.php$ {
        #    root           html;
        #    fastcgi_pass   127.0.0.1:9000;
        #    fastcgi_index  index.php;
        #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
        #    include        fastcgi_params;
        #}

        # deny access to .htaccess files, if Apache's document root
        # concurs with nginx's one
        #
        #location ~ /\.ht {
        #    deny  all;
        #}
    }


    # another virtual host using mix of IP-, name-, and port-based configuration
    #
    #server {
    #    listen       8000;
    #    listen       somename:8080;
    #    server_name  somename  alias  another.alias;

    #    location / {
    #        root   html;
    #        index  index.html index.htm;
    #    }
    #}


    # HTTPS server
    #
    #server {
    #    listen       443 ssl;
    #    server_name  localhost;

    #    ssl_certificate      cert.pem;
    #    ssl_certificate_key  cert.key;

    #    ssl_session_cache    shared:SSL:1m;
    #    ssl_session_timeout  5m;

    #    ssl_ciphers  HIGH:!aNULL:!MD5;
    #    ssl_prefer_server_ciphers  on;

    #    location / {
    #        root   html;
    #        index  index.html index.htm;
    #    }
    #}

}
